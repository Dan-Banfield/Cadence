name: Build unsigned IPA

# Produces an unsigned Cadence.ipa on a hosted macOS runner. Download it from
# the run's "Artifacts" section, then install with AltStore / Sideloadly, which
# re-sign it with your own Apple ID. No signing secrets are used or needed here.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Cadence.xcodeproj \
            -scheme Cadence \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned .ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Cadence.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH" >&2
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Cadence-unsigned.ipa Payload
          echo "Built $(du -h Cadence-unsigned.ipa | cut -f1) unsigned IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: Cadence-unsigned-ipa
          path: Cadence-unsigned.ipa
          if-no-files-found: error
