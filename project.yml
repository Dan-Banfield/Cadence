# XcodeGen spec. The CI runner turns this into Cadence.xcodeproj so we never
# have to hand-maintain a .pbxproj. Install XcodeGen locally (brew install
# xcodegen) and run `xcodegen generate` if you ever want the project on a Mac.
name: Cadence
options:
  bundleIdPrefix: com.example.cadence
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"

targets:
  Cadence:
    type: application
    platform: iOS
    sources:
      - path: Cadence
    settings:
      base:
        # Change this to something unique to you before you ship anywhere.
        # (AltStore with a free Apple ID rewrites it on install anyway.)
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cadence
